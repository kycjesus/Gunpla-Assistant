<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gunpla Parts Catalogue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:      #0f1117;
    --surface: #161b27;
    --card:    #1c2333;
    --border:  #252e42;
    --border2: #2e3a52;
    --accent:  #f5a623;
    --accent2: #4a9eff;
    --green:   #34d399;
    --red:     #f87171;
    --text:    #e2e8f0;
    --muted:   #64748b;
    --dim:     #94a3b8;
    --bright:  #f8fafc;
    --mono:    'DM Mono', monospace;
    --sans:    'Outfit', sans-serif;
  }
  html { scroll-behavior: smooth; }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 15px; line-height: 1.5; min-height: 100vh; }
  body::before {
    content: ''; position: fixed; inset: 0;
    background-image: linear-gradient(var(--border) 1px, transparent 1px), linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 40px 40px; opacity: 0.18; pointer-events: none; z-index: 0;
  }

  /* ── SHARED HEADER ── */
  .page-header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(15,17,23,0.92); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 0 32px; height: 64px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .header-left { display: flex; align-items: center; gap: 16px; }
  .logo-mark {
    font-family: var(--mono); font-size: 13px; font-weight: 500;
    color: var(--accent); letter-spacing: 0.06em; cursor: pointer;
    padding: 5px 10px; border: 1px solid rgba(245,166,35,0.3);
    border-radius: 5px; transition: all 0.15s;
  }
  .logo-mark:hover { background: rgba(245,166,35,0.08); }
  .header-title { font-size: 16px; font-weight: 600; color: var(--bright); letter-spacing: -0.01em; }
  .header-sub { font-family: var(--mono); font-size: 11px; color: var(--muted); letter-spacing: 0.05em; margin-top: 1px; }
  .header-right { display: flex; align-items: center; gap: 12px; }
  .stat-pill { display: flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .stat-pill strong { color: var(--dim); font-size: 13px; }
  .collapse-btns { display: flex; gap: 6px; }
  .ctrl-btn {
    padding: 5px 12px; border-radius: 6px; border: 1px solid var(--border2);
    background: transparent; color: var(--dim); font-family: var(--sans);
    font-size: 12px; font-weight: 500; cursor: pointer; transition: all 0.15s; white-space: nowrap;
  }
  .ctrl-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ── SCREEN SWITCHER ── */
  .screen { display: none; }
  .screen.active { display: block; }

  /* ══════════════════════════════════
     CATALOGUE SCREEN
  ══════════════════════════════════ */
  .cat-body { position: relative; z-index: 1; max-width: 1200px; margin: 0 auto; padding: 32px 32px 80px; }

  /* Search + filter bar */
  .search-bar {
    display: flex; gap: 12px; align-items: center;
    margin-bottom: 28px;
  }
  .search-wrap {
    flex: 1; position: relative;
  }
  .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 15px; pointer-events: none; }
  .search-input {
    width: 100%; padding: 10px 14px 10px 40px;
    background: var(--card); border: 1px solid var(--border2);
    border-radius: 8px; color: var(--bright); font-family: var(--sans);
    font-size: 14px; outline: none; transition: border-color 0.15s;
  }
  .search-input::placeholder { color: var(--muted); }
  .search-input:focus { border-color: var(--accent2); }
  .search-clear {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    color: var(--muted); cursor: pointer; font-size: 18px; display: none;
    transition: color 0.15s; line-height: 1;
  }
  .search-clear:hover { color: var(--dim); }
  .kit-count-badge {
    font-family: var(--mono); font-size: 11px; color: var(--muted); white-space: nowrap;
  }
  .kit-count-badge strong { color: var(--accent); }

  /* Grade filter pills */
  .grade-filters {
    display: flex; gap: 6px; flex-wrap: wrap;
    margin-bottom: 28px;
  }
  .grade-pill {
    padding: 5px 12px; border-radius: 20px;
    border: 1px solid var(--border);
    background: transparent; color: var(--muted);
    font-family: var(--sans); font-size: 12px; font-weight: 500;
    cursor: pointer; transition: all 0.15s; white-space: nowrap;
    display: flex; align-items: center; gap: 6px;
  }
  .grade-pill .pill-count { font-family: var(--mono); font-size: 10px; opacity: 0.7; }
  .grade-pill:hover { border-color: var(--border2); color: var(--dim); }
  .grade-pill.active { background: var(--surface); border-color: var(--accent2); color: var(--accent2); }
  .grade-pill.active-all { background: var(--surface); border-color: var(--border2); color: var(--bright); }

  /* Grade sections */
  .grade-section { margin-bottom: 40px; }
  .grade-heading {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 14px;
  }
  .grade-heading-label {
    display: flex; align-items: center; gap: 10px;
  }
  .grade-code {
    font-family: var(--mono); font-size: 11px; font-weight: 500;
    color: #000; background: var(--accent2);
    padding: 2px 8px; border-radius: 4px; letter-spacing: 0.08em;
  }
  .grade-name { font-size: 14px; font-weight: 600; color: var(--bright); }
  .grade-kit-count { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .grade-heading::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  /* Kit grid */
  .kit-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 12px;
  }

  .kit-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 8px; overflow: hidden; cursor: pointer;
    transition: border-color 0.15s, transform 0.15s, box-shadow 0.15s;
    position: relative;
  }
  .kit-card:hover {
    border-color: var(--border2);
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
  }
  .kit-card.has-data { border-color: rgba(74,158,255,0.35); }
  .kit-card.has-data:hover { border-color: var(--accent2); }

  .kit-img-wrap {
    aspect-ratio: 1; overflow: hidden;
    background: var(--surface);
    display: flex; align-items: center; justify-content: center;
  }
  .kit-img { width: 100%; height: 100%; object-fit: cover; display: block; transition: opacity 0.2s; }
  .kit-img-placeholder {
    font-family: var(--mono); font-size: 11px; color: var(--muted);
    text-align: center; padding: 20px;
  }

  .kit-info { padding: 10px 12px; }
  .kit-name {
    font-size: 12px; font-weight: 600; color: var(--bright);
    line-height: 1.35; margin-bottom: 4px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .kit-meta {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 5px;
  }
  .kit-series { font-size: 10px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .kit-year { font-family: var(--mono); font-size: 10px; color: var(--muted); flex-shrink: 0; margin-left: 6px; }

  .kit-data-badge {
    position: absolute; top: 8px; right: 8px;
    background: var(--accent2); color: #000;
    font-family: var(--mono); font-size: 9px; font-weight: 600;
    padding: 2px 6px; border-radius: 3px; letter-spacing: 0.06em;
  }

  /* No results */
  .no-results {
    text-align: center; padding: 80px 20px;
    color: var(--muted); font-size: 14px;
  }
  .no-results strong { display: block; font-size: 18px; color: var(--dim); margin-bottom: 8px; }

  /* ══════════════════════════════════
     PARTS VIEWER SCREEN
  ══════════════════════════════════ */
  .back-btn {
    display: flex; align-items: center; gap: 6px;
    padding: 5px 12px; border-radius: 6px;
    border: 1px solid var(--border2); background: transparent;
    color: var(--dim); font-family: var(--sans); font-size: 12px; font-weight: 500;
    cursor: pointer; transition: all 0.15s;
  }
  .back-btn:hover { border-color: var(--accent); color: var(--accent); }

  .kit-badge { display: flex; align-items: center; gap: 10px; }
  .grade-tag {
    background: var(--accent); color: #000;
    font-family: var(--mono); font-size: 10px; font-weight: 500;
    letter-spacing: 0.12em; padding: 3px 8px; border-radius: 3px; white-space: nowrap;
  }

  /* ── PROGRESS BAR ── */
  .progress-bar-wrap {
    position: sticky; top: 64px; z-index: 99;
    background: rgba(15,17,23,0.95); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
    padding: 10px 32px; display: flex; align-items: center; gap: 16px;
  }
  .progress-label { font-family: var(--mono); font-size: 11px; color: var(--muted); white-space: nowrap; }
  .progress-label strong { color: var(--dim); }
  .progress-track { flex: 1; height: 4px; background: var(--border); border-radius: 99px; overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--accent2), var(--green)); transition: width 0.4s ease; width: 0%; }
  .progress-fill.done { background: var(--green); }
  .progress-pct { font-family: var(--mono); font-size: 11px; color: var(--muted); width: 36px; text-align: right; }

  /* ── PARTS LAYOUT ── */
  .parts-body { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; padding: 40px 32px 80px; }

  .nav-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 36px; }
  .tab-btn { padding: 6px 14px; border-radius: 6px; border: 1px solid var(--border); background: transparent; color: var(--muted); font-family: var(--sans); font-size: 12px; font-weight: 500; cursor: pointer; transition: all 0.15s; white-space: nowrap; }
  .tab-btn:hover { border-color: var(--border2); color: var(--dim); }
  .tab-btn.active { background: var(--accent); border-color: var(--accent); color: #000; font-weight: 600; }
  .tab-btn.body-tab.active { background: var(--accent2); border-color: var(--accent2); color: #fff; }
  .tab-all.active { background: var(--surface); border-color: var(--border2); color: var(--bright); }

  /* section block */
  .section-block { margin-bottom: 28px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); overflow: hidden; animation: fadeUp 0.3s ease both; }
  @keyframes fadeUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
  .section-head { display: flex; align-items: center; gap: 14px; padding: 16px 20px; border-bottom: 1px solid var(--border); cursor: pointer; user-select: none; transition: background 0.15s; }
  .section-head:hover { background: rgba(255,255,255,0.02); }
  .section-num { font-family: var(--mono); font-size: 11px; color: var(--muted); width: 22px; flex-shrink: 0; }
  .section-label { display: flex; align-items: center; gap: 10px; flex: 1; }
  .section-title { font-size: 15px; font-weight: 600; color: var(--bright); letter-spacing: -0.01em; }
  .section-step { font-family: var(--mono); font-size: 10px; color: var(--accent); background: rgba(245,166,35,0.1); border: 1px solid rgba(245,166,35,0.2); padding: 2px 7px; border-radius: 4px; letter-spacing: 0.05em; }
  .section-body-tag { font-family: var(--mono); font-size: 10px; color: var(--accent2); background: rgba(74,158,255,0.1); border: 1px solid rgba(74,158,255,0.15); padding: 2px 7px; border-radius: 4px; }
  .section-weapon-tag { font-family: var(--mono); font-size: 10px; color: var(--red); background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.15); padding: 2px 7px; border-radius: 4px; }
  .section-meta { display: flex; align-items: center; gap: 10px; margin-left: auto; }
  .cut-count { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .cut-count strong { color: var(--dim); }
  .chevron { color: var(--muted); font-size: 12px; transition: transform 0.2s; flex-shrink: 0; }
  .section-block.collapsed .chevron { transform: rotate(-90deg); }
  .section-block.collapsed .section-content { display: none; }

  /* complete state */
  .complete-btn { display: flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 6px; border: 1px solid var(--border2); background: transparent; color: var(--muted); font-family: var(--sans); font-size: 12px; font-weight: 500; cursor: pointer; transition: all 0.15s; white-space: nowrap; flex-shrink: 0; }
  .complete-btn:hover { border-color: var(--green); color: var(--green); }
  .complete-btn.done { background: rgba(52,211,153,0.1); border-color: rgba(52,211,153,0.4); color: var(--green); }
  .section-block.complete .section-head { opacity: 0.55; }
  .section-block.complete .section-title { text-decoration: line-through; text-decoration-color: rgba(52,211,153,0.5); }
  .section-block.complete .section-content { opacity: 0.45; pointer-events: none; }

  /* runner rows */
  .section-content { padding: 0; }
  .runner-row { display: grid; grid-template-columns: 160px 1fr 48px; align-items: start; gap: 0; border-bottom: 1px solid var(--border); min-height: 48px; }
  .runner-row:last-child { border-bottom: none; }
  .runner-cell { padding: 12px 16px; display: flex; align-items: center; border-right: 1px solid var(--border); min-height: 48px; }
  .runner-chip { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 5px; font-family: var(--mono); font-size: 11px; font-weight: 500; letter-spacing: 0.04em; white-space: nowrap; }
  .runner-chip .dup-badge { font-size: 9px; background: rgba(0,0,0,0.25); border-radius: 3px; padding: 1px 4px; letter-spacing: 0.06em; }
  .parts-cell { padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
  .part-tag { font-family: var(--mono); font-size: 11px; background: var(--surface); border: 1px solid var(--border2); color: var(--dim); border-radius: 4px; padding: 3px 8px; cursor: pointer; transition: all 0.12s; user-select: none; }
  .part-tag:hover { border-color: var(--accent); color: var(--accent); }
  .part-tag.cut { background: rgba(52,211,153,0.12); border-color: rgba(52,211,153,0.4); color: var(--green); text-decoration: line-through; opacity: 0.65; }
  .part-tag.dup { border-color: rgba(245,166,35,0.35); color: var(--accent); }
  .qty-cell { padding: 12px 8px; text-align: center; font-family: var(--mono); font-size: 12px; font-weight: 500; color: var(--dim); min-height: 48px; display: flex; align-items: center; justify-content: center; }

  /* section footer */
  .section-footer { display: flex; align-items: center; justify-content: space-between; padding: 10px 20px; border-top: 1px solid var(--border); background: rgba(255,255,255,0.015); }
  .footer-runners { display: flex; flex-wrap: wrap; gap: 5px; }
  .runner-summary-chip { font-family: var(--mono); font-size: 10px; padding: 2px 7px; border-radius: 4px; border: 1px solid transparent; opacity: 0.85; }
  .section-total { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .section-total strong { color: var(--bright); font-size: 13px; }

  /* note banner */
  .note-banner { margin: 0 20px 12px; padding: 8px 12px; background: rgba(245,166,35,0.07); border-left: 2px solid var(--accent); border-radius: 0 5px 5px 0; font-size: 12px; color: var(--dim); font-style: italic; }

  /* category divider */
  .category-divider { display: flex; align-items: center; gap: 12px; margin: 36px 0 20px; }
  .category-divider span { font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; color: var(--muted); text-transform: uppercase; white-space: nowrap; }
  .category-divider::before, .category-divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .category-divider.weapon span { color: var(--red); }
  .category-divider.weapon::before, .category-divider.weapon::after { background: rgba(248,113,113,0.2); }

  /* empty kit state */
  .empty-kit-msg { padding: 60px 32px; text-align: center; color: var(--muted); }
  .empty-kit-msg strong { display: block; font-size: 18px; color: var(--dim); margin-bottom: 10px; }
  .empty-kit-msg p { font-size: 13px; max-width: 340px; margin: 0 auto; line-height: 1.6; }
  .empty-kit-img { width: 120px; height: 120px; object-fit: cover; border-radius: 8px; margin: 0 auto 20px; display: block; border: 1px solid var(--border); }

  /* ── RUNNER COLORS ── */
  .r-A  { background: rgba(128,128,128,0.2); color: #b0b8c8; border: 1px solid rgba(128,128,128,0.3); }
  .r-B  { background: rgba(100,100,100,0.2); color: #a8b0c0; border: 1px solid rgba(100,100,100,0.3); }
  .r-C  { background: rgba(80,80,80,0.2);   color: #9aa0ae; border: 1px solid rgba(80,80,80,0.3); }
  .r-D1 { background: rgba(192,192,192,0.15); color: #c8d0dc; border: 1px solid rgba(192,192,192,0.3); }
  .r-D2 { background: rgba(184,134,11,0.2);  color: #e8b830; border: 1px solid rgba(184,134,11,0.35); }
  .r-E  { background: rgba(110,110,100,0.2); color: #aab0bc; border: 1px solid rgba(110,110,100,0.3); }
  .r-F  { background: rgba(90,90,80,0.2);    color: #a2a8b4; border: 1px solid rgba(90,90,80,0.3); }
  .r-G1 { background: rgba(70,80,90,0.25);   color: #98a4b2; border: 1px solid rgba(70,80,90,0.4); }
  .r-G2 { background: rgba(55,65,75,0.25);   color: #8e9aaa; border: 1px solid rgba(55,65,75,0.4); }
  .r-H1 { background: rgba(91,63,160,0.25);  color: #b090e8; border: 1px solid rgba(91,63,160,0.4); }
  .r-H2 { background: rgba(59,34,112,0.3);   color: #9870d0; border: 1px solid rgba(59,34,112,0.45); }
  .r-I1 { background: rgba(240,240,240,0.08); color: #d8e0ec; border: 1px solid rgba(240,240,240,0.15); }
  .r-I2 { background: rgba(20,20,20,0.4);    color: #8090a8; border: 1px solid rgba(80,90,110,0.35); }
  .r-J  { background: rgba(220,220,220,0.08); color: #c8d4e4; border: 1px solid rgba(220,220,220,0.15); }
  .r-K  { background: rgba(30,40,55,0.5);    color: #788898; border: 1px solid rgba(60,75,95,0.5); }
  .r-St { background: rgba(200,0,0,0.2);     color: #f87171; border: 1px solid rgba(200,0,0,0.35); }

  @media (max-width: 700px) {
    .page-header { padding: 0 16px; }
    .cat-body, .parts-body { padding: 20px 16px 60px; }
    .runner-row { grid-template-columns: 120px 1fr 40px; }
    .header-right .stat-pill, .header-right .collapse-btns { display: none; }
    .kit-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
  }
</style>
</head>
<body>

<!-- ══════════════════════════════
     CATALOGUE SCREEN
══════════════════════════════ -->
<div id="screenCatalogue" class="screen active">

  <header class="page-header">
    <div class="header-left">
      <span class="logo-mark">GUNPLA DB</span>
      <div>
        <div class="header-title">Gunpla Parts Catalogue</div>
        <div class="header-sub">BANDAI SPIRITS · SELECT A KIT TO VIEW PARTS</div>
      </div>
    </div>
    <div class="header-right">
      <div class="stat-pill">KITS <strong id="catKitCount">1993</strong></div>
    </div>
  </header>

  <div class="cat-body">
    <!-- Search -->
    <div class="search-bar">
      <div class="search-wrap">
        <span class="search-icon">⌕</span>
        <input class="search-input" id="searchInput" type="text" placeholder="Search kits, series, grade…" oninput="handleSearch(this.value)">
        <span class="search-clear" id="searchClear" onclick="clearSearch()">×</span>
      </div>
      <span class="kit-count-badge" id="searchResultCount"></span>
    </div>

    <!-- Grade filter pills -->
    <div class="grade-filters" id="gradeFilters"></div>

    <!-- Kit grid -->
    <div id="kitGrid"></div>
  </div>

</div>

<!-- ══════════════════════════════
     PARTS VIEWER SCREEN
══════════════════════════════ -->
<div id="screenParts" class="screen">

  <header class="page-header" id="partsHeader">
    <div class="header-left">
      <button class="back-btn" onclick="goBack()">← Back</button>
      <div class="kit-badge">
        <span class="grade-tag" id="partsGradeTag">MG 1/100</span>
        <div>
          <div class="header-title" id="partsKitName">Kit Name</div>
          <div class="header-sub" id="partsKitSub">Series</div>
        </div>
      </div>
    </div>
    <div class="header-right">
      <div class="stat-pill">SECTIONS <strong id="hdr-sections">—</strong></div>
      <div class="stat-pill">TOTAL CUTS <strong id="hdr-cuts">—</strong></div>
      <div class="collapse-btns">
        <button class="ctrl-btn" onclick="expandAll()">Expand All</button>
        <button class="ctrl-btn" onclick="collapseAll()">Collapse All</button>
      </div>
    </div>
  </header>

  <div class="progress-bar-wrap">
    <span class="progress-label">BUILD PROGRESS <strong id="prog-done">0</strong> / <strong id="prog-total">—</strong></span>
    <div class="progress-track"><div class="progress-fill" id="progFill"></div></div>
    <span class="progress-pct" id="progPct">0%</span>

let searchQuery = '';
let activeGrade = 'ALL';

function handleSearch(val) {
  searchQuery = val.trim().toLowerCase();
  document.getElementById('searchClear').style.display = val ? 'block' : 'none';
  renderKitGrid();
}

function clearSearch() {
  document.getElementById('searchInput').value = '';
  handleSearch('');
}

function setGradeFilter(code) {
  activeGrade = code;
  document.querySelectorAll('.grade-pill').forEach(p => {
    p.classList.remove('active','active-all');
    if (p.dataset.grade === code) {
      p.classList.add(code === 'ALL' ? 'active-all' : 'active');
    }
  });
  renderKitGrid();
}

function renderGradeFilters() {
  const el = document.getElementById('gradeFilters');
  const allCount = Object.values(CATALOGUE).reduce((a,g) => a + g.kits.length, 0);
  let html = `<button class="grade-pill active-all" data-grade="ALL" onclick="setGradeFilter('ALL')">All <span class="pill-count">${allCount}</span></button>`;
  for (const code of GRADE_ORDER) {
    if (!CATALOGUE[code]) continue;
    const label = CATALOGUE[code].label;
    const count = CATALOGUE[code].kits.length;
    html += `<button class="grade-pill" data-grade="${code}" onclick="setGradeFilter('${code}')">${label} <span class="pill-count">${count}</span></button>`;
  }
  el.innerHTML = html;
}

function renderKitGrid() {
  const container = document.getElementById('kitGrid');
  const gradesToShow = activeGrade === 'ALL' ? GRADE_ORDER : [activeGrade];
  let html = '';

  if (activeGrade === 'ALL' && !searchQuery) {
    // Flat grid — all kits sorted by latest release
    let allKits = [];
    for (const code of GRADE_ORDER) {
      if (!CATALOGUE[code]) continue;
      for (const k of CATALOGUE[code].kits) allKits.push({ ...k, gradeCode: code });
    }
    allKits.sort((a, b) => (b.y || '0').localeCompare(a.y || '0'));
    html = `<div class="kit-grid">${allKits.map(k => renderKitCard(k, k.gradeCode)).join('')}</div>`;
    document.getElementById('searchResultCount').innerHTML = '';
    container.innerHTML = html;
    return;
  }

  // Filtered view — collect matching kits across grades, still sort by year
  let allFiltered = [];
  for (const code of gradesToShow) {
    if (!CATALOGUE[code]) continue;
    const grade = CATALOGUE[code];
    const filtered = grade.kits.filter(k => {
      if (!searchQuery) return true;
      return (k.n||'').toLowerCase().includes(searchQuery) ||
             (k.s||'').toLowerCase().includes(searchQuery) ||
             code.toLowerCase().includes(searchQuery) ||
             grade.label.toLowerCase().includes(searchQuery);
    });
    for (const k of filtered) allFiltered.push({ ...k, gradeCode: code });
  }

  allFiltered.sort((a, b) => (b.y || '0').localeCompare(a.y || '0'));

  if (!allFiltered.length) {
    html = `<div class="no-results"><strong>No kits found</strong>Try a different search term or grade filter.</div>`;
  } else {
    // If filtering by a specific grade, show a heading; otherwise flat
    if (activeGrade !== 'ALL') {
      const grade = CATALOGUE[activeGrade];
      html = `<div class="grade-section">
        <div class="grade-heading">
          <div class="grade-heading-label">
            <span class="grade-code">${activeGrade}</span>
            <span class="grade-name">${grade.label}</span>
            <span class="grade-kit-count">${allFiltered.length} kit${allFiltered.length!==1?'s':''}</span>
          </div>
        </div>
        <div class="kit-grid">${allFiltered.map(k => renderKitCard(k, k.gradeCode)).join('')}</div>
      </div>`;
    } else {
      html = `<div class="kit-grid">${allFiltered.map(k => renderKitCard(k, k.gradeCode)).join('')}</div>`;
    }
  }

  container.innerHTML = html;
  document.getElementById('searchResultCount').innerHTML =
    `<strong>${allFiltered.length}</strong> result${allFiltered.length!==1?'s':''}`;
}

function renderKitCard(kit, gradeCode) {
  const hasData = !!KIT_PARTS_DATA[kit.id];
  const name = kit.n || '(No English name)';
  const dataBadge = hasData ? `<span class="kit-data-badge">PARTS</span>` : '';
  const imgHtml = kit.img
    ? `<img class="kit-img" src="${kit.img}" alt="${name}" loading="lazy" onerror="this.style.display='none'">`
    : `<div class="kit-img-placeholder">No image</div>`;

  return `<div class="kit-card ${hasData?'has-data':''}" onclick="openKit(${kit.id},'${gradeCode}')">
    ${dataBadge}
    <div class="kit-img-wrap">${imgHtml}</div>
    <div class="kit-info">
      <div class="kit-name">${name}</div>
      <div class="kit-meta">
        <span class="kit-series">${kit.s||''}</span>
        <span class="kit-year">${kit.y||''}</span>
      </div>
    </div>
  </div>`;
}

// ══════════════════════════════════════════════════════
// NAVIGATION
// ══════════════════════════════════════════════════════
let currentKitId = null;
let cutState = {};
let completeState = {};
let activeFilter = 'all';

function openKit(kitId, gradeCode) {
  currentKitId = kitId;
  cutState = {};
  completeState = {};
  activeFilter = 'all';

  // Find kit info
  const grade = CATALOGUE[gradeCode];
  const kit = grade.kits.find(k => k.id === kitId);
  if (!kit) return;

  // Update header
  document.getElementById('partsGradeTag').textContent = gradeCode;
  document.getElementById('partsKitName').textContent = kit.n || '(Unnamed Kit)';
  document.getElementById('partsKitSub').textContent =
    [kit.s, kit.y ? `· ${kit.y}` : ''].filter(Boolean).join(' ');

  // Switch screen
  document.getElementById('screenCatalogue').classList.remove('active');
  document.getElementById('screenParts').classList.add('active');
  window.scrollTo(0,0);

  // Render parts or empty state
  const sections = KIT_PARTS_DATA[kitId] || null;
  renderPartsScreen(sections, kit);
}

function goBack() {
  document.getElementById('screenParts').classList.remove('active');
  document.getElementById('screenCatalogue').classList.add('active');
  window.scrollTo(0,0);
}

// ══════════════════════════════════════════════════════
// PARTS SCREEN RENDERING
// ══════════════════════════════════════════════════════
function renderPartsScreen(sections, kit) {
  if (!sections) {
    // Empty state
    document.getElementById('navTabs').innerHTML = '';
    document.getElementById('hdr-sections').textContent = '—';
    document.getElementById('hdr-cuts').textContent = '—';
    document.getElementById('prog-done').textContent = '0';
    document.getElementById('prog-total').textContent = '—';
    document.getElementById('progFill').style.width = '0%';
    document.getElementById('progPct').textContent = '0%';
    const imgHtml = kit.img
      ? `<img class="empty-kit-img" src="${kit.img}" alt="${kit.n}">`
      : '';
    document.getElementById('sectionsContainer').innerHTML = `
      <div class="empty-kit-msg">
        ${imgHtml}
        <strong>No parts data yet</strong>
        <p>Parts data for this kit hasn't been entered yet. Add the manual and run the extractor to populate this kit.</p>
      </div>`;
    return;
  }

  // Has data — full render
  const totalCutsAll = sections.reduce((a,s) => a + s.runners.reduce((b,r) => b + r.p.length, 0), 0);
  document.getElementById('hdr-sections').textContent = sections.length;
  document.getElementById('hdr-cuts').textContent = totalCutsAll;
  document.getElementById('prog-total').textContent = sections.length;
  updateProgress(sections);
  renderTabs(sections);
  renderSections(sections);
}

function renderTabs(sections) {
  const btns = [
    { id:'all', label:'All Sections', cls:'tab-all' },
    ...sections.map(s => ({ id:s.id, label:s.name, cls:s.type==='body'?'body-tab':'weapon-tab' }))
  ];
  document.getElementById('navTabs').innerHTML = btns.map(b =>
    `<button class="tab-btn ${b.cls} ${activeFilter===b.id?'active':''}" onclick="setFilter('${b.id}')">${b.label}</button>`
  ).join('');
}

function setFilter(id) {
  activeFilter = id;
  const sections = KIT_PARTS_DATA[currentKitId];
  renderTabs(sections);
  renderSections(sections);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderSections(sections) {
  const visible = activeFilter === 'all' ? sections : sections.filter(s => s.id === activeFilter);
  let html = '';
  let lastType = null;
  for (const sec of visible) {
    if (activeFilter === 'all' && sec.type !== lastType) {
      if (sec.type === 'weapon') html += `<div class="category-divider weapon"><span>⚔ Weaponry</span></div>`;
      else if (!lastType) html += `<div class="category-divider"><span>🤖 Body</span></div>`;
      lastType = sec.type;
    }
    html += renderSection(sec);
  }
  document.getElementById('sectionsContainer').innerHTML = html;
}

function renderSection(sec) {
  const isDone = !!completeState[sec.id];
  const cuts = sec.runners.reduce((a,r) => a + r.p.length, 0);
  const typeTag = sec.type === 'weapon'
    ? `<span class="section-weapon-tag">WEAPON</span>`
    : `<span class="section-body-tag">BODY</span>`;
  const runnerChips = sec.runners.map(r =>
    `<span class="runner-summary-chip ${RUNNER_CLASS[r.r]||''}">${r.r}${['B','C','J','K'].includes(r.r)?'×2':''}</span>`
  ).join('');
  const rows = sec.runners.map(r => renderRunnerRow(sec.id, r)).join('');
  const noteHtml = sec.note ? `<div class="note-banner">⚠ ${sec.note}</div>` : '';
  return `
  <div class="section-block ${isDone?'complete':''}" id="sec-${sec.id}" onclick="toggleSection(event,'${sec.id}')">
    <div class="section-head">
      <span class="section-num">${sec.num}</span>
      <div class="section-label">
        <span class="section-title">${sec.name}</span>
        <span class="section-step">${sec.step}</span>
        ${typeTag}
      </div>
      <div class="section-meta">
        <span class="cut-count"><strong>${cuts}</strong> cuts</span>
        <button class="complete-btn ${isDone?'done':''}" onclick="event.stopPropagation();toggleComplete('${sec.id}')">
          <span class="check-icon">${isDone?'✓':'○'}</span> ${isDone?'Complete':'Mark Complete'}
        </button>
        <span class="chevron">▾</span>
      </div>
    </div>
    <div class="section-content" onclick="event.stopPropagation()">
      ${noteHtml}
      <div class="runner-table">${rows}</div>
      <div class="section-footer">
        <div class="footer-runners">${runnerChips}</div>
        <span class="section-total">Total: <strong>${cuts}</strong> cuts</span>
      </div>
    </div>
  </div>`;
}

function renderRunnerRow(secId, runner) {
  const rname = runner.r;
  const counts = {};
  for (const p of runner.p) counts[p] = (counts[p]||0) + 1;
  const rclass = RUNNER_CLASS[rname] || '';
  const isDup = ['B','C','J','K'].includes(rname);
  const qty = runner.p.length;
  const dupBadge = isDup ? `<span class="dup-badge">×2</span>` : '';
  const parts = Object.entries(counts).sort((a,b)=>parseInt(a[0])-parseInt(b[0])).map(([num,count]) => {
    const key = `${secId}-${rname}-${num}`;
    const isCut = !!cutState[key];
    const isDupPart = count > 1;
    const label = count > 1 ? `${num}×${count}` : `${num}`;
    const cls = ['part-tag', isCut?'cut':'', isDupPart&&!isCut?'dup':''].filter(Boolean).join(' ');
    return `<span class="${cls}" onclick="togglePart('${key}',this)">${label}</span>`;
  }).join('');
  return `<div class="runner-row">
    <div class="runner-cell"><span class="runner-chip ${rclass}">${rname}${dupBadge}</span></div>
    <div class="parts-cell">${parts}</div>
    <div class="qty-cell">${qty}</div>
  </div>`;
}

function toggleSection(e, id) {
  document.getElementById('sec-'+id)?.classList.toggle('collapsed');
}

function togglePart(key, el) {
  cutState[key] = !cutState[key];
  el.classList.toggle('cut');
  if (!el.classList.contains('cut') && el.textContent.includes('×')) el.classList.add('dup');
  else el.classList.remove('dup');
}

function toggleComplete(id) {
  completeState[id] = !completeState[id];
  const block = document.getElementById('sec-'+id);
  const btn = block.querySelector('.complete-btn');
  if (completeState[id]) {
    block.classList.add('complete');
    btn.classList.add('done');
    btn.innerHTML = '<span class="check-icon">✓</span> Complete';
  } else {
    block.classList.remove('complete');
    btn.classList.remove('done');
    btn.innerHTML = '<span class="check-icon">○</span> Mark Complete';
  }
  updateProgress(KIT_PARTS_DATA[currentKitId]);
}

function updateProgress(sections) {
  if (!sections) return;
  const done = Object.values(completeState).filter(Boolean).length;
  const total = sections.length;
  const pct = Math.round((done/total)*100);
  document.getElementById('prog-done').textContent = done;
  document.getElementById('prog-total').textContent = total;
  document.getElementById('progPct').textContent = pct+'%';
  const fill = document.getElementById('progFill');
  fill.style.width = pct+'%';
  fill.classList.toggle('done', done === total);
}

function expandAll() { document.querySelectorAll('.section-block').forEach(b => b.classList.remove('collapsed')); }
function collapseAll() { document.querySelectorAll('.section-block').forEach(b => b.classList.add('collapsed')); }

// ══════════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════════
renderGradeFilters();
renderKitGrid();
</script>
</body>
</html>
