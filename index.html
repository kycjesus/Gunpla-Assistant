<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MG 1/100 Barbatos Lupus — Parts List</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0f1117;
    --surface:   #161b27;
    --card:      #1c2333;
    --border:    #252e42;
    --border2:   #2e3a52;
    --accent:    #f5a623;
    --accent2:   #4a9eff;
    --green:     #34d399;
    --text:      #e2e8f0;
    --muted:     #64748b;
    --dim:       #94a3b8;
    --bright:    #f8fafc;
    --mono:      'DM Mono', monospace;
    --sans:      'Outfit', sans-serif;
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.5;
    min-height: 100vh;
  }

  /* subtle grid texture */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
      linear-gradient(var(--border) 1px, transparent 1px),
      linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 40px 40px;
    opacity: 0.18;
    pointer-events: none;
    z-index: 0;
  }

  /* ── PAGE HEADER ── */
  .page-header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(15,17,23,0.92);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 0 32px;
    height: 64px;
    display: flex; align-items: center; justify-content: space-between;
  }

  .header-left { display: flex; align-items: center; gap: 16px; }

  .kit-badge {
    display: flex; align-items: center; gap: 10px;
  }

  .grade-tag {
    background: var(--accent);
    color: #000;
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.12em;
    padding: 3px 8px;
    border-radius: 3px;
    white-space: nowrap;
  }

  .kit-name {
    font-size: 16px;
    font-weight: 600;
    color: var(--bright);
    letter-spacing: -0.01em;
  }

  .kit-sub {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.05em;
  }

  .header-right {
    display: flex; align-items: center; gap: 20px;
  }

  .stat-pill {
    display: flex; align-items: center; gap: 6px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
  }
  .stat-pill strong {
    color: var(--dim);
    font-size: 13px;
  }

  /* ── LAYOUT ── */
  .page-body {
    position: relative; z-index: 1;
    max-width: 1100px;
    margin: 0 auto;
    padding: 40px 32px 80px;
  }

  /* ── SECTION TABS ── */
  .nav-tabs {
    display: flex; gap: 6px; flex-wrap: wrap;
    margin-bottom: 36px;
  }

  .tab-btn {
    padding: 6px 14px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    font-family: var(--sans);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .tab-btn:hover { border-color: var(--border2); color: var(--dim); }
  .tab-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #000;
    font-weight: 600;
  }
  .tab-btn.body-tab.active { background: var(--accent2); border-color: var(--accent2); color: #fff; }
  .tab-all.active { background: var(--surface); border-color: var(--border2); color: var(--bright); }

  /* ── SECTION BLOCK ── */
  .section-block {
    margin-bottom: 28px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card);
    overflow: hidden;
    animation: fadeUp 0.3s ease both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .section-head {
    display: flex; align-items: center; gap: 14px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    user-select: none;
    transition: background 0.15s;
  }
  .section-head:hover { background: rgba(255,255,255,0.02); }

  .section-num {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    width: 22px;
    flex-shrink: 0;
  }

  .section-label {
    display: flex; align-items: center; gap: 10px;
    flex: 1;
  }

  .section-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--bright);
    letter-spacing: -0.01em;
  }

  .section-step {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--accent);
    background: rgba(245,166,35,0.1);
    border: 1px solid rgba(245,166,35,0.2);
    padding: 2px 7px;
    border-radius: 4px;
    letter-spacing: 0.05em;
  }

  .section-body-tag {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--accent2);
    background: rgba(74,158,255,0.1);
    border: 1px solid rgba(74,158,255,0.15);
    padding: 2px 7px;
    border-radius: 4px;
    letter-spacing: 0.04em;
  }

  .section-weapon-tag {
    font-family: var(--mono);
    font-size: 10px;
    color: #f87171;
    background: rgba(248,113,113,0.1);
    border: 1px solid rgba(248,113,113,0.15);
    padding: 2px 7px;
    border-radius: 4px;
    letter-spacing: 0.04em;
  }

  .section-meta {
    display: flex; align-items: center; gap: 10px;
    margin-left: auto;
  }

  .cut-count {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
  }
  .cut-count strong { color: var(--dim); }

  .chevron {
    color: var(--muted);
    font-size: 12px;
    transition: transform 0.2s;
    flex-shrink: 0;
  }
  .section-block.collapsed .chevron { transform: rotate(-90deg); }
  .section-block.collapsed .section-content { display: none; }

  /* ── RUNNER ROWS ── */
  .section-content { padding: 0; }

  .runner-row {
    display: grid;
    grid-template-columns: 160px 1fr 48px;
    align-items: start;
    gap: 0;
    border-bottom: 1px solid var(--border);
    min-height: 48px;
  }
  .runner-row:last-child { border-bottom: none; }

  .runner-cell {
    padding: 12px 16px;
    display: flex; align-items: center;
    border-right: 1px solid var(--border);
    min-height: 48px;
  }

  .runner-chip {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 4px 10px;
    border-radius: 5px;
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.04em;
    white-space: nowrap;
  }

  .runner-chip .dup-badge {
    font-size: 9px;
    background: rgba(0,0,0,0.25);
    border-radius: 3px;
    padding: 1px 4px;
    letter-spacing: 0.06em;
  }

  .parts-cell {
    padding: 10px 16px;
    display: flex; flex-wrap: wrap; gap: 5px;
    align-items: center;
  }

  .part-tag {
    font-family: var(--mono);
    font-size: 11px;
    background: var(--surface);
    border: 1px solid var(--border2);
    color: var(--dim);
    border-radius: 4px;
    padding: 3px 8px;
    cursor: pointer;
    transition: all 0.12s;
    user-select: none;
  }
  .part-tag:hover { border-color: var(--accent); color: var(--accent); }
  .part-tag.cut {
    background: rgba(52,211,153,0.12);
    border-color: rgba(52,211,153,0.4);
    color: var(--green);
    text-decoration: line-through;
    opacity: 0.65;
  }
  .part-tag.dup {
    border-color: rgba(245,166,35,0.35);
    color: var(--accent);
  }
  .part-tag.dup:hover { border-color: var(--accent); }

  .qty-cell {
    padding: 12px 8px;
    text-align: center;
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 500;
    color: var(--dim);
    min-height: 48px;
    display: flex; align-items: center; justify-content: center;
  }

  /* ── SECTION FOOTER ── */
  .section-footer {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 20px;
    border-top: 1px solid var(--border);
    background: rgba(255,255,255,0.015);
  }

  .footer-runners {
    display: flex; flex-wrap: wrap; gap: 5px;
  }

  .runner-summary-chip {
    font-family: var(--mono);
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 4px;
    border: 1px solid transparent;
    opacity: 0.85;
  }

  .section-total {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
  }
  .section-total strong { color: var(--bright); font-size: 13px; }

  /* ── NOTE BANNER ── */
  .note-banner {
    margin: 0 20px 12px;
    padding: 8px 12px;
    background: rgba(245,166,35,0.07);
    border-left: 2px solid var(--accent);
    border-radius: 0 5px 5px 0;
    font-size: 12px;
    color: var(--dim);
    font-style: italic;
  }

  /* ── DIVIDER ── */
  .category-divider {
    display: flex; align-items: center; gap: 12px;
    margin: 36px 0 20px;
  }
  .category-divider span {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--muted);
    text-transform: uppercase;
    white-space: nowrap;
  }
  .category-divider::before, .category-divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }
  .category-divider.weapon span { color: #f87171; }
  .category-divider.weapon::before, .category-divider.weapon::after { background: rgba(248,113,113,0.2); }

  /* ── RUNNER COLORS ── */
  .r-A    { background: rgba(128,128,128,0.2); color: #b0b8c8; border: 1px solid rgba(128,128,128,0.3); }
  .r-B    { background: rgba(100,100,100,0.2); color: #a8b0c0; border: 1px solid rgba(100,100,100,0.3); }
  .r-C    { background: rgba(80,80,80,0.2);   color: #9aa0ae; border: 1px solid rgba(80,80,80,0.3); }
  .r-D1   { background: rgba(192,192,192,0.15); color: #c8d0dc; border: 1px solid rgba(192,192,192,0.3); }
  .r-D2   { background: rgba(184,134,11,0.2);  color: #e8b830; border: 1px solid rgba(184,134,11,0.35); }
  .r-E    { background: rgba(110,110,100,0.2); color: #aab0bc; border: 1px solid rgba(110,110,100,0.3); }
  .r-F    { background: rgba(90,90,80,0.2);    color: #a2a8b4; border: 1px solid rgba(90,90,80,0.3); }
  .r-G1   { background: rgba(70,80,90,0.25);   color: #98a4b2; border: 1px solid rgba(70,80,90,0.4); }
  .r-G2   { background: rgba(55,65,75,0.25);   color: #8e9aaa; border: 1px solid rgba(55,65,75,0.4); }
  .r-H1   { background: rgba(91,63,160,0.25);  color: #b090e8; border: 1px solid rgba(91,63,160,0.4); }
  .r-H2   { background: rgba(59,34,112,0.3);   color: #9870d0; border: 1px solid rgba(59,34,112,0.45); }
  .r-I1   { background: rgba(240,240,240,0.08); color: #d8e0ec; border: 1px solid rgba(240,240,240,0.15); }
  .r-I2   { background: rgba(20,20,20,0.4);    color: #8090a8; border: 1px solid rgba(80,90,110,0.35); }
  .r-J    { background: rgba(220,220,220,0.08); color: #c8d4e4; border: 1px solid rgba(220,220,220,0.15); }
  .r-K    { background: rgba(30,40,55,0.5);    color: #788898; border: 1px solid rgba(60,75,95,0.5); }
  .r-St   { background: rgba(200,0,0,0.2);     color: #f87171; border: 1px solid rgba(200,0,0,0.35); }

  .collapse-btns { display: flex; gap: 6px; }

  .ctrl-btn {
    padding: 5px 12px;
    border-radius: 6px;
    border: 1px solid var(--border2);
    background: transparent;
    color: var(--dim);
    font-family: var(--sans);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .ctrl-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ── RESPONSIVE ── */
  @media (max-width: 700px) {
    .page-header { padding: 0 16px; }
    .page-body { padding: 24px 16px 60px; }
    .runner-row { grid-template-columns: 120px 1fr 40px; }
    .header-right { display: none; }
  }
</style>
</head>

// ── HELPERS ──────────────────────────────────────────────────
function partCounts(parts) {
  const c = {};
  for (const p of parts) c[p] = (c[p]||0) + 1;
  return c;
}

function isDupRunner(rname) {
  return ['B','C','J','K'].includes(rname);
}

function totalCuts(section) {
  return section.runners.reduce((acc, r) => acc + r.p.length, 0);
}

// ── STATE ─────────────────────────────────────────────────────
const cutState = {}; // { "chest-B-10-0": true }
let activeFilter = 'all';

// ── RENDER ─────────────────────────────────────────────────────
function renderAll() {
  renderTabs();
  renderSections();
  updateHeaderStats();
}

function renderTabs() {
  const container = document.getElementById('navTabs');
  const btns = [
    { id:'all', label:'All Sections', cls:'tab-all' },
    ...SECTIONS.map(s => ({ id: s.id, label: s.name, cls: s.type==='body' ? 'body-tab' : 'weapon-tab' }))
  ];
  container.innerHTML = btns.map(b =>
    `<button class="tab-btn ${b.cls} ${activeFilter===b.id?'active':''}"
      onclick="setFilter('${b.id}')">${b.label}</button>`
  ).join('');
}

function setFilter(id) {
  activeFilter = id;
  renderAll();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderSections() {
  const container = document.getElementById('sectionsContainer');
  const visible = activeFilter === 'all'
    ? SECTIONS
    : SECTIONS.filter(s => s.id === activeFilter);

  let html = '';
  let lastType = null;

  for (const sec of visible) {
    if (activeFilter === 'all' && sec.type !== lastType) {
      if (sec.type === 'weapon') {
        html += `<div class="category-divider weapon"><span>⚔ Weaponry</span></div>`;
      } else if (lastType === null) {
        html += `<div class="category-divider"><span>🤖 Body</span></div>`;
      }
      lastType = sec.type;
    }
    html += renderSection(sec);
  }

  container.innerHTML = html;
}

function renderSection(sec) {
  const cuts = totalCuts(sec);
  const typeTag = sec.type === 'weapon'
    ? `<span class="section-weapon-tag">WEAPON</span>`
    : `<span class="section-body-tag">BODY</span>`;

  const runnerChips = sec.runners.map(r =>
    `<span class="runner-summary-chip ${RUNNER_CLASS[r.r]||''}">${r.r}${isDupRunner(r.r)?'×2':''}</span>`
  ).join('');

  const rows = sec.runners.map(r => renderRunnerRow(sec.id, r)).join('');

  const noteHtml = sec.note
    ? `<div class="note-banner">⚠ ${sec.note}</div>`
    : '';

  return `
  <div class="section-block" id="sec-${sec.id}" onclick="toggleSection(event,'${sec.id}')">
    <div class="section-head">
      <span class="section-num">${sec.num}</span>
      <div class="section-label">
        <span class="section-title">${sec.name}</span>
        <span class="section-step">${sec.step}</span>
        ${typeTag}
      </div>
      <div class="section-meta">
        <span class="cut-count"><strong>${cuts}</strong> cuts</span>
        <span class="chevron">▾</span>
      </div>
    </div>
    <div class="section-content" onclick="event.stopPropagation()">
      ${noteHtml}
      <div class="runner-table">
        ${rows}
      </div>
      <div class="section-footer">
        <div class="footer-runners">${runnerChips}</div>
        <span class="section-total">Total: <strong>${cuts}</strong> cuts</span>
      </div>
    </div>
  </div>`;
}

function renderRunnerRow(secId, runner) {
  const rname = runner.r;
  const counts = partCounts(runner.p);
  const rclass = RUNNER_CLASS[rname] || '';
  const isDup = isDupRunner(rname);
  const qty = runner.p.length;

  const chipLabel = rname + (isDup ? '' : '');
  const dupBadge = isDup ? `<span class="dup-badge">×2</span>` : '';

  const parts = Object.entries(counts).sort((a,b) => parseInt(a[0])-parseInt(b[0])).map(([num, count]) => {
    const key = `${secId}-${rname}-${num}`;
    const isCut = !!cutState[key];
    const isDupPart = count > 1;
    const label = count > 1 ? `${num}×${count}` : `${num}`;
    const classes = ['part-tag', isCut?'cut':'', isDupPart&&!isCut?'dup':''].filter(Boolean).join(' ');
    return `<span class="${classes}" onclick="togglePart('${key}',this)">${label}</span>`;
  }).join('');

  return `
  <div class="runner-row">
    <div class="runner-cell">
      <span class="runner-chip ${rclass}">${chipLabel}${dupBadge}</span>
    </div>
    <div class="parts-cell">${parts}</div>
    <div class="qty-cell">${qty}</div>
  </div>`;
}

function toggleSection(e, id) {
  const block = document.getElementById('sec-' + id);
  if (block) block.classList.toggle('collapsed');
}

function togglePart(key, el) {
  cutState[key] = !cutState[key];
  el.classList.toggle('cut');
  if (el.classList.contains('cut')) {
    el.classList.remove('dup');
  } else {
    // restore dup class if count > 1 (check label)
    if (el.textContent.includes('×')) el.classList.add('dup');
  }
}

function updateHeaderStats() {
  const total = SECTIONS.reduce((acc,s) => acc + totalCuts(s), 0);
  document.getElementById('hdr-cuts').textContent = total;
  document.getElementById('hdr-sections').textContent = SECTIONS.length;
}

function expandAll() {
  document.querySelectorAll('.section-block').forEach(b => b.classList.remove('collapsed'));
}

function collapseAll() {
  document.querySelectorAll('.section-block').forEach(b => b.classList.add('collapsed'));
}

// ── INIT ─────────────────────────────────────────────────────
renderAll();
</script>
</body>
</html>
